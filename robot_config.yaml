# =============================================================================
# robot_config.yaml
# Single source of truth for the 4-arm neurosurgical robot simulation.
#
# Units: lengths in mm, angles in degrees, mass in kg, torque in N*m.
# Keys carry their unit as a suffix where it is not obvious.
#
# "PARTS:"     = value supplied in the PARTS block (do not change casually).
# "ASSUMPTION:"= engineering placeholder chosen to make the simulation run.
#                Replace with CAD/datasheet values when available.
#
# Nothing in the Python code may hardcode a dimension, limit, ratio, noise
# value or performance target: it must be read from this file.
# =============================================================================

meta:
  project: "4-arm neurosurgical robot"
  version: "0.2.0"
  stage: 1
  description: >
    Four 6-DOF arms sharing one world frame, operating on a silicone/3D-printed
    phantom head in a rigid clamp. A1 is the main instrument arm, A2/A3 are
    micro arms, A4 carries the camera and laser. Stage 1 = config + URDF +
    PyBullet scene (head, clamp, table).

world:
  frame: "single shared world frame; URDF root link is 'world'"
  up_axis: "z"
  gravity_m_s2: -9.81
  control_loop_hz: 1000                      # PARTS: 1 kHz control loop
  vision_loop_hz: 30                         # PARTS: vision loop 30-60 Hz
  vision_loop_options_hz: [30, 60]           # PARTS: 30-60 Hz
  bus: "CAN-FD"                              # PARTS
  driver_options:                            # PARTS
    - "Maxon EPOS4 (CANopen)"
    - "ODrive S1"
  controller:                                # PARTS
    os: "Linux"
    kernel: "PREEMPT_RT"
    middleware: "ROS 2"
    framework: "ros2_control"
  safety:                                    # PARTS + safety assumptions
    e_stop: "hardware e-stop through safety relay"
    safety_relay_class: "Pilz PNOZ class"
    watchdog_timeout_ms: 50                  # ASSUMPTION: stage-7 watchdog
    brake_on_every_joint: true               # PARTS: power-off EM brake
    force_limit_n: 5.0                       # ASSUMPTION: stage-7 test limit
    speeds:                                  # ASSUMPTION: stage-7 test limits
      A1_max_deg_s: 60
      micro_max_deg_s: 30
      sensing_max_deg_s: 45
    collision_monitoring: true

materials:
  aluminium_7075:                            # PARTS: 7075 aluminium
    density_kg_m3: 2810                      # ASSUMPTION: standard alloy value
    youngs_modulus_gpa: 71.7
    color_rgba: [0.70, 0.73, 0.78, 1.0]
  carbon_fibre_tube:                         # PARTS: carbon-fibre tube
    density_kg_m3: 1600                      # ASSUMPTION: typical CFRP density
    youngs_modulus_gpa: 70                   # ASSUMPTION: typical CFRP
    color_rgba: [0.10, 0.11, 0.13, 1.0]
  stainless_steel:                           # PARTS: instrument material option
    density_kg_m3: 8000                      # ASSUMPTION: 316 stainless
    youngs_modulus_gpa: 193                  # ASSUMPTION: 316 stainless
    color_rgba: [0.82, 0.84, 0.87, 1.0]
  polymer_3d_printed:                        # PARTS: instrument material option
    density_kg_m3: 1250                      # ASSUMPTION: printed polymer
    youngs_modulus_gpa: 2.5                  # ASSUMPTION
    color_rgba: [0.90, 0.88, 0.78, 1.0]

# -----------------------------------------------------------------------------
# Real hardware catalogue. All joint modules are referenced by these IDs.
# -----------------------------------------------------------------------------
components:
  harmonic_drives:
    CSF-17-100:                              # PARTS: A1 shoulder/elbow
      ratio: 100
      max_backlash_arcmin: 1.0               # PARTS: under 1 arc-min
      efficiency: 0.80                       # ASSUMPTION
      mass_kg: 0.42                          # ASSUMPTION: envelope value
      envelope_diameter_mm: 70               # ASSUMPTION: size-17 envelope
      envelope_length_mm: 29                 # ASSUMPTION
    CSF-14-100:                              # PARTS: A1 wrist and A4 joints
      ratio: 100
      max_backlash_arcmin: 1.0               # PARTS
      efficiency: 0.80                       # ASSUMPTION
      mass_kg: 0.25                          # ASSUMPTION
      envelope_diameter_mm: 58               # ASSUMPTION
      envelope_length_mm: 26                 # ASSUMPTION
    CSF-11-100:                              # PARTS: A2/A3 joints
      ratio: 100
      max_backlash_arcmin: 1.0               # PARTS
      efficiency: 0.78                       # ASSUMPTION
      mass_kg: 0.16                          # ASSUMPTION
      envelope_diameter_mm: 50               # ASSUMPTION
      envelope_length_mm: 22                 # ASSUMPTION

  motors:
    maxon_ec_i_40:                           # PARTS: A1 shoulder/elbow
      mass_kg: 0.35                          # ASSUMPTION
      envelope_diameter_mm: 40               # ASSUMPTION
      envelope_length_mm: 74                 # ASSUMPTION
      nominal_torque_nm: 0.12                # ASSUMPTION: verify datasheet
      peak_torque_nm: 0.36                   # ASSUMPTION: verify datasheet
      max_speed_rpm: 6000                    # ASSUMPTION
      rotor_inertia_kg_m2: 0.000025          # ASSUMPTION
    maxon_ec_i_30:                           # PARTS: A1 wrist and A4 joints
      mass_kg: 0.20                          # ASSUMPTION
      envelope_diameter_mm: 30               # ASSUMPTION
      envelope_length_mm: 62                 # ASSUMPTION
      nominal_torque_nm: 0.05                # ASSUMPTION: verify datasheet
      peak_torque_nm: 0.15                   # ASSUMPTION: verify datasheet
      max_speed_rpm: 7000                    # ASSUMPTION
      rotor_inertia_kg_m2: 0.000008          # ASSUMPTION
    maxon_ec_20_flat:                        # PARTS: A2/A3 joints
      mass_kg: 0.09                          # ASSUMPTION
      envelope_diameter_mm: 20               # ASSUMPTION
      envelope_length_mm: 16                 # ASSUMPTION
      nominal_torque_nm: 0.012               # ASSUMPTION: verify datasheet
      peak_torque_nm: 0.040                  # ASSUMPTION: verify datasheet
      max_speed_rpm: 8000                    # ASSUMPTION
      rotor_inertia_kg_m2: 0.0000015         # ASSUMPTION

  brakes:                                    # PARTS: brake on every joint
    power_off_em_basic:
      type: "power-off electromagnetic"
      mass_kg: 0.08                          # ASSUMPTION
      holding_torque_nm: 0.5                 # ASSUMPTION: verify with supplier
      engages_when: "power removed"
      engage_time_ms: 50                     # ASSUMPTION: stage-3 brake model
      release_time_ms: 80                    # ASSUMPTION: stage-3 brake model

  encoders:                                  # PARTS: AS5047P, 14-bit
    as5047p_motor_side:
      model: "AMS AS5047P"
      bits: 14
      counts_per_rev: 16384                  # PARTS: 14-bit = 16384 counts/rev
      position: "motor side"
    as5047p_joint_side:
      model: "AMS AS5047P"
      bits: 14
      counts_per_rev: 16384                  # PARTS
      position: "joint side"

  fine_stages:                               # PARTS: A2/A3 tips, PI class
    pi_p611_nanocube_class:
      axes: 3
      travel_um: 100                          # PARTS: ~100 um
      mass_kg: 0.20                           # ASSUMPTION
      envelope_xyz_mm: [25, 40, 40]           # ASSUMPTION: x = along tool
      stiffness_n_per_um: 0.1                 # ASSUMPTION: stage-5 placeholder

  force_sensor:                              # PARTS: ATI Nano17 on A1 wrist
    ati_nano17:
      axes: 6
      mass_kg: 0.015                          # ASSUMPTION
      envelope_diameter_mm: 17                # ASSUMPTION
      envelope_length_mm: 14.6                # ASSUMPTION
      force_noise_n: 0.02                     # ASSUMPTION
      torque_noise_nmm: 0.2                   # ASSUMPTION

  cameras:                                   # PARTS: Intel RealSense D405
    intel_realsense_d405:
      depth_range_mm: [70, 500]               # PARTS: 7-50 cm
      depth_resolution_px: [1280, 720]        # PARTS: 1280x720 depth
      horizontal_fov_deg: 87                  # ASSUMPTION: datasheet approx.
      mass_kg: 0.06                           # ASSUMPTION
      envelope_mm: {depth: 23, width: 42, height: 42}  # ASSUMPTION
      noise_model:
        model: "gaussian depth + pixel noise"
        pixel_sigma_px: 0.3                   # ASSUMPTION
        depth_sigma_constant_mm: 0.10         # ASSUMPTION
        depth_sigma_relative: 0.002           # ASSUMPTION (0.2% of range)

  lasers:                                    # PARTS: 650 nm Class 2
    laser_650nm_dot:
      wavelength_nm: 650                      # PARTS
      safety_class: 2                         # PARTS: Class 2, under 1 mW
      max_power_mw: 0.9                       # PARTS: under 1 mW; 0.9 mW cap
      pattern_options: [dot, line]            # PARTS: dot/line module
      pattern_default: dot
      camera_filter_bandpass_nm: 10           # PARTS: ~10 nm bandpass filter
      envelope_diameter_mm: 10                # ASSUMPTION
      envelope_length_mm: 20                  # ASSUMPTION

  tracking:                                  # PARTS: backup tracking
    ndi_polaris_vega_st:
      accuracy_mm: 0.12                       # PARTS
      marker_type: "passive IR"               # PARTS
      role: "backup"

  leader_handles:                            # PARTS: leader handles
    prototype: "3D Systems Touch"
    alternative: "Force Dimension sigma.7"
    default_motion_scale: 5.0                 # ASSUMPTION
    motion_scale_range: [1.0, 20.0]           # PARTS: 1:1 to 20:1
    tremor_filter:
      enabled_by_default: true               # ASSUMPTION
      cutoff_hz: 8.0                         # ASSUMPTION: stage-5 low-pass

  prototype_alternative:
    actuator: "Dynamixel XM430-W350"          # PARTS
    encoder_counts_per_rev: 4096              # PARTS: 4096 counts/rev
    note: "Bench prototype option; not used by the URDF model."

# Stage-3 actuator simulation assumptions (no PARTS values were given).
actuators:
  position_gain_hz: 20                       # ASSUMPTION: closed-loop bandwidth
  max_step_deg_per_loop: 0.5                 # ASSUMPTION: slew clamp per 1 kHz tick

instrument:                                  # PARTS: 5 mm instrument shaft
  shaft_diameter_mm: 5.0                      # PARTS
  material_options: [polymer_3d_printed, stainless_steel]  # PARTS: either
  material_default: "stainless_steel"         # ASSUMPTION: stiffer default
  insertion_axis: "along local +x of tool link"

# -----------------------------------------------------------------------------
# Patient phantom and arm layout.
# -----------------------------------------------------------------------------
phantom:
  head_center_mm: [0, 0, 300]                 # ASSUMPTION: world coordinates
  head_radii_mm: [90, 100, 110]               # ASSUMPTION: phantom head size
  head_material: "3D-printed shell / silicone"  # PARTS
  head_color_rgba: [0.93, 0.84, 0.78, 1.0]    # ASSUMPTION: silicone skin tone
  head_clamp:
    type: "rigid head clamp frame"            # PARTS
    frame: "fixed to world; surrounds phantom head"
    color_rgba: [0.16, 0.17, 0.19, 1.0]       # ASSUMPTION
    post_diameter_mm: 12                      # ASSUMPTION
    ring_radius_mm: 130                       # ASSUMPTION
    ring_center_z_mm: 300                     # ASSUMPTION: ring plane at head-centre height
    ring_cross_section_mm: [30, 12]           # ASSUMPTION: [height, radial thickness]
    post_count: 4                             # ASSUMPTION: stage-1 visuals
    segment_count: 16                         # ASSUMPTION: ring discretisation
  table:                                      # ASSUMPTION: stage-1 operating table
    top_surface_z_mm: 190                     # ASSUMPTION: head bottom (300-110) rests here
    top_size_mm: [1200, 700]                  # ASSUMPTION: [x, y]
    top_thickness_mm: 40                      # ASSUMPTION
    color_rgba: [0.25, 0.28, 0.32, 1.0]       # ASSUMPTION

# Nominal points the arms start near / aim at (used from stage 1 onward).
targets_mm:
  A1: [0, -10, 390]                           # ASSUMPTION
  A2: [40, -40, 380]                          # ASSUMPTION
  A3: [40, 40, 380]                           # ASSUMPTION
  A4: [0, 0, 380]                             # ASSUMPTION: laser/camera aim

performance_targets_mm:                       # PARTS: accuracy targets
  A1: 0.5                                     # A1 under 0.5 mm
  A2: 0.1                                     # A2 under 0.1 mm
  A3: 0.1                                     # A3 under 0.1 mm
  A4: null                                    # not specified

# -----------------------------------------------------------------------------
# ARMS — 4 arms x 6 revolute joints = 24 axes.
# Joint chain geometry (all lengths measured joint-axis to joint-axis):
#   base column -> j1(yaw) -> j2(pitch) --upper_arm--> j3(pitch)
#   --forearm--> j4(roll) --wrist_roll--> j5(pitch)
#   --wrist_pitch--> j6(roll) --tool--> tip
# The listed five lengths must sum to reach_mm.
# Base mounts and home poses are stage-0 layout assumptions; stage 2 verifies
# reach and collisions and may adjust them.
# -----------------------------------------------------------------------------
arms:
  - id: A1
    role: "main instrument arm"
    reach_mm: 450                             # PARTS
    payload_kg: 1.0                           # PARTS
    wrist:
      type: "serial"
    fine_stage: null
    force_sensor:                             # PARTS: ATI Nano17 on A1 wrist
      component: ati_nano17
      mount: "wrist, before tool"
    base_mount:
      xyz_mm: [-300, -100, 250]               # ASSUMPTION
      rpy_deg: [0, 0, 20]                     # ASSUMPTION
    base_column_mm: 60                        # ASSUMPTION
    geometry:
      link_lengths_mm:
        upper_arm: 190
        forearm: 150
        wrist_roll: 35
        wrist_pitch: 35
        tool: 40
      tube_outer_diameter_mm: 36              # ASSUMPTION
      tube_wall_mm: 3.0                       # ASSUMPTION
      link_materials:
        - aluminium_7075
        - aluminium_7075
        - carbon_fibre_tube
        - carbon_fibre_tube
        - carbon_fibre_tube
        - carbon_fibre_tube
    actuator_groups:                          # PARTS: joint drive assignment
      - joints: [1, 2, 3]
        harmonic_drive: CSF-17-100
        motor: maxon_ec_i_40
      - joints: [4, 5, 6]
        harmonic_drive: CSF-14-100
        motor: maxon_ec_i_30
    encoders:
      motor_side: as5047p_motor_side
      joint_side: as5047p_joint_side
    brake: power_off_em_basic
    joint_axes: [z, y, y, x, y, x]
    joint_limits_deg:
      j1: {min: -170, max: 170}               # ASSUMPTION
      j2: {min: -120, max: 120}               # ASSUMPTION
      j3: {min: -150, max: 150}               # ASSUMPTION
      j4: {min: -180, max: 180}               # ASSUMPTION
      j5: {min: -120, max: 120}               # ASSUMPTION
      j6: {min: -180, max: 180}               # ASSUMPTION
    home_deg: [0, -30, 60, 0, 30, 0]          # ASSUMPTION
    max_joint_velocity_deg_s: 60              # ASSUMPTION: safety-limited

  - id: A2
    role: "micro instrument arm (tendon-driven wrist)"
    reach_mm: 250                             # PARTS
    payload_kg: 0.3                           # PARTS
    wrist:
      type: "tendon_driven"                   # PARTS
      tendon_visual_count: 4                  # ASSUMPTION: for stage-1 visuals
    fine_stage:                               # PARTS: piezo XYZ at tip
      component: pi_p611_nanocube_class
      mount: "tip, before instrument"
    force_sensor: null
    base_mount:
      xyz_mm: [150, -150, 480]                # ASSUMPTION
      rpy_deg: [0, 0, 135]                    # ASSUMPTION
    base_column_mm: 50                        # ASSUMPTION
    geometry:
      link_lengths_mm:
        upper_arm: 95
        forearm: 70
        wrist_roll: 25
        wrist_pitch: 20
        tool: 40
      tube_outer_diameter_mm: 22              # ASSUMPTION
      tube_wall_mm: 2.0                       # ASSUMPTION
      link_materials:
        - aluminium_7075
        - aluminium_7075
        - carbon_fibre_tube
        - carbon_fibre_tube
        - carbon_fibre_tube
        - carbon_fibre_tube
    actuator_groups:                          # PARTS
      - joints: [1, 2, 3, 4, 5, 6]
        harmonic_drive: CSF-11-100
        motor: maxon_ec_20_flat
    encoders:
      motor_side: as5047p_motor_side
      joint_side: as5047p_joint_side
    brake: power_off_em_basic
    joint_axes: [z, y, y, x, y, x]
    joint_limits_deg:
      j1: {min: -150, max: 150}               # ASSUMPTION
      j2: {min: -110, max: 110}               # ASSUMPTION
      j3: {min: -140, max: 140}               # ASSUMPTION
      j4: {min: -150, max: 150}               # ASSUMPTION
      j5: {min: -100, max: 100}               # ASSUMPTION
      j6: {min: -150, max: 150}               # ASSUMPTION
    home_deg: [0, -40, 70, 0, 30, 0]          # ASSUMPTION
    max_joint_velocity_deg_s: 30              # ASSUMPTION

  - id: A3
    role: "micro instrument arm (tendon-driven wrist)"
    reach_mm: 250                             # PARTS
    payload_kg: 0.3                           # PARTS
    wrist:
      type: "tendon_driven"                   # PARTS
      tendon_visual_count: 4                  # ASSUMPTION
    fine_stage:                               # PARTS: piezo XYZ at tip
      component: pi_p611_nanocube_class
      mount: "tip, before instrument"
    force_sensor: null
    base_mount:
      xyz_mm: [150, 150, 480]                 # ASSUMPTION
      rpy_deg: [0, 0, -135]                   # ASSUMPTION
    base_column_mm: 50                        # ASSUMPTION
    geometry:
      link_lengths_mm:
        upper_arm: 95
        forearm: 70
        wrist_roll: 25
        wrist_pitch: 20
        tool: 40
      tube_outer_diameter_mm: 22              # ASSUMPTION
      tube_wall_mm: 2.0                       # ASSUMPTION
      link_materials:
        - aluminium_7075
        - aluminium_7075
        - carbon_fibre_tube
        - carbon_fibre_tube
        - carbon_fibre_tube
        - carbon_fibre_tube
    actuator_groups:                          # PARTS
      - joints: [1, 2, 3, 4, 5, 6]
        harmonic_drive: CSF-11-100
        motor: maxon_ec_20_flat
    encoders:
      motor_side: as5047p_motor_side
      joint_side: as5047p_joint_side
    brake: power_off_em_basic
    joint_axes: [z, y, y, x, y, x]
    joint_limits_deg:
      j1: {min: -150, max: 150}               # ASSUMPTION
      j2: {min: -110, max: 110}               # ASSUMPTION
      j3: {min: -140, max: 140}               # ASSUMPTION
      j4: {min: -150, max: 150}               # ASSUMPTION
      j5: {min: -100, max: 100}               # ASSUMPTION
      j6: {min: -150, max: 150}               # ASSUMPTION
    home_deg: [0, -40, 70, 0, 30, 0]          # ASSUMPTION
    max_joint_velocity_deg_s: 30              # ASSUMPTION

  - id: A4
    role: "sensing arm (camera + laser)"
    reach_mm: 350                             # PARTS
    payload_kg: 0.3                           # PARTS: camera + laser = 0.3 kg
    wrist:
      type: "serial"
    fine_stage: null
    force_sensor: null
    end_effector:
      camera:                                 # PARTS
        component: intel_realsense_d405
        mount_offset_mm: [18, 0, 0]           # ASSUMPTION: on tool link
        view_axis: "local +x"
      laser:                                  # PARTS
        component: laser_650nm_dot
        mount_offset_mm: [-4, 0, 20]          # ASSUMPTION: above tool link
        aim_axis: "local +x"
    base_mount:
      xyz_mm: [-100, 250, 500]                # ASSUMPTION
      rpy_deg: [0, 0, -68]                    # ASSUMPTION
    base_column_mm: 55                        # ASSUMPTION
    geometry:
      link_lengths_mm:
        upper_arm: 140
        forearm: 110
        wrist_roll: 30
        wrist_pitch: 30
        tool: 40
      tube_outer_diameter_mm: 30              # ASSUMPTION
      tube_wall_mm: 2.5                       # ASSUMPTION
      link_materials:
        - aluminium_7075
        - aluminium_7075
        - carbon_fibre_tube
        - carbon_fibre_tube
        - carbon_fibre_tube
        - carbon_fibre_tube
    actuator_groups:                          # PARTS: A4 joints CSF-14 + EC-i 30
      - joints: [1, 2, 3, 4, 5, 6]
        harmonic_drive: CSF-14-100
        motor: maxon_ec_i_30
    encoders:
      motor_side: as5047p_motor_side
      joint_side: as5047p_joint_side
    brake: power_off_em_basic
    joint_axes: [z, y, y, x, y, x]
    joint_limits_deg:
      j1: {min: -170, max: 170}               # ASSUMPTION
      j2: {min: -120, max: 120}               # ASSUMPTION
      j3: {min: -150, max: 150}               # ASSUMPTION
      j4: {min: -180, max: 180}               # ASSUMPTION
      j5: {min: -120, max: 120}               # ASSUMPTION
      j6: {min: -180, max: 180}               # ASSUMPTION
    home_deg: [0, -25, 55, 0, 20, 0]          # ASSUMPTION
    max_joint_velocity_deg_s: 45              # ASSUMPTION

# -----------------------------------------------------------------------------
# Error budget (simulated from stage 3 onward).
# -----------------------------------------------------------------------------
error_budget:
  backlash:
    source: "harmonic drive, every joint"
    max_arcmin: 1.0                           # PARTS: under 1 arc-min
    enabled: true
  encoder_quantisation:
    encoder: as5047p_joint_side
    bits: 14                                  # PARTS
    counts_per_rev: 16384                     # PARTS
    enabled: true
  calibration_offset_mm: 0.2                  # PARTS
  camera_noise:
    model: "gaussian pixel + depth noise"
    pixel_sigma_px: 0.3                       # ASSUMPTION
    depth_sigma_constant_mm: 0.10             # ASSUMPTION
    depth_sigma_relative: 0.002               # ASSUMPTION
    enabled: true
  tissue_shift:
    max_mm: 1.0                               # PARTS
    model: "slow random walk, bounded by max_mm"  # ASSUMPTION
    enabled: true

# -----------------------------------------------------------------------------
# Optional CAD meshes. For each arm link, the generator looks for a file in
# cad_meshes.directory using cad_meshes.filename_template. If it exists, the
# STL is used for the visual; otherwise a simple primitive assembly is built
# from the component dimensions above. Collision geometry stays primitive
# unless collision_from_mesh is true (safer for concave STLs).
# Export meshes in metres at the link-frame origin, +x along the link.
# -----------------------------------------------------------------------------
cad_meshes:
  enabled: true
  format: "stl"
  directory: "meshes"
  filename_template: "{arm_id}_{link_id}.stl"
  link_ids: [base, link1, link2, link3, link4, link5, link6]
  scale: [1.0, 1.0, 1.0]                      # change to 0.001 if exported in mm
  collision_from_mesh: false

# -----------------------------------------------------------------------------
# Visual style for primitive fallbacks (all sizes come from components above).
# -----------------------------------------------------------------------------
visualization:
  colors_rgba:
    harmonic_drive: [0.80, 0.82, 0.86, 1.0]
    motor: [0.12, 0.13, 0.15, 1.0]
    brake: [0.30, 0.31, 0.34, 1.0]
    tube_aluminium: [0.70, 0.73, 0.78, 1.0]
    tube_carbon: [0.10, 0.11, 0.13, 1.0]
    camera: [0.16, 0.17, 0.20, 1.0]
    laser: [0.85, 0.10, 0.08, 1.0]
    instrument: [0.85, 0.87, 0.90, 1.0]
    force_sensor: [0.55, 0.58, 0.62, 1.0]
    piezo_stage: [0.75, 0.65, 0.20, 1.0]
  motor_side_offset_factor: 1.10              # center distance = factor*(R_hd+R_motor)
  tube_segments: 24                           # visual smoothness
  joint_housing_as_cylinder: true
  show_base_column: true
